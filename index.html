<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>M2 Work Platform</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
padding:20px;
font-family:Arial,sans-serif;
background:#111827;
color:white;
display:flex;
justify-content:center;
align-items:center
}

.box{
width:100%;
max-width:420px;
background:#1f2937;
padding:28px 20px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 35px #0008
}

.logo{
width:70px;
height:70px;
margin:auto;
border-radius:18px;
background:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
font-weight:bold
}

h1{margin:18px 0 8px}
p{color:#cbd5e1}

input,button{
width:100%;
padding:14px;
margin:7px 0;
border:0;
border-radius:10px;
font-size:16px
}

button{
background:#2563eb;
color:white;
font-weight:bold;
cursor:pointer
}

.lang{background:#374151}

.register{
color:#60a5fa;
margin:16px 0;
cursor:pointer
}

.features{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px
}

.feature{
background:#374151;
padding:14px;
border-radius:12px
}
</style>
</head>

<body>

<div class="box">

<button class="lang" id="lang">English</button>

<div class="logo">M2</div>

<h1 id="title">منصة M2 للعمل</h1>

<p id="desc">منصة للعمل وإدارة الحساب والطلبات</p>

<input id="email" type="email" placeholder="البريد الإلكتروني">

<input id="password" type="password" placeholder="كلمة المرور">

<input id="invite" type="text" placeholder="كود الدعوة">

<button id="login">تسجيل الدخول</button>

<div class="register" id="register">
ليس لديك حساب؟ إنشاء حساب
</div>

<div class="features">
<div class="feature">💼 وظائف</div>
<div class="feature">💰 إيداع وسحب</div>
<div class="feature">👤 حساب المستخدم</div>
<div class="feature">🛡️ موافقة الإدارة</div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// ===============================
// Supabase
// ===============================

const SUPABASE_URL =
"https://scjyudgdvlfzeewbnmyt.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"https://scjyudgdvlfzeewbnmyt.supabase.co";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


// ===============================
// اللغة
// ===============================

let ar=true;

document.getElementById("lang").onclick=function(){

ar=!ar;

document.documentElement.lang=ar?"ar":"en";
document.documentElement.dir=ar?"rtl":"ltr";

document.getElementById("lang").textContent=
ar?"English":"العربية";

document.getElementById("title").textContent=
ar?"منصة M2 للعمل":"M2 Work Platform";

document.getElementById("desc").textContent=
ar
?"منصة للعمل وإدارة الحساب والطلبات"
:"Platform for work, account and requests";

document.getElementById("email").placeholder=
ar?"البريد الإلكتروني":"Email";

document.getElementById("password").placeholder=
ar?"كلمة المرور":"Password";

document.getElementById("invite").placeholder=
ar?"كود الدعوة":"Invitation Code";

document.getElementById("login").textContent=
ar?"تسجيل الدخول":"Login";

document.getElementById("register").textContent=
ar
?"ليس لديك حساب؟ إنشاء حساب"
:"Don't have an account? Register";

};


// ===============================
// تسجيل الدخول
// ===============================

document.getElementById("login").onclick =
async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

if(!email || !password){

alert(
ar
?"يرجى إدخال البريد الإلكتروني وكلمة المرور"
:"Please enter email and password"
);

return;
}

const { data, error } =
await supabaseClient.auth.signInWithPassword({
email: email,
password: password
});

if(error){

alert(
ar
?"خطأ: "+error.message
:"Error: "+error.message
);

return;
}

alert(
ar
?"تم تسجيل الدخول بنجاح"
:"Login successful"
);

};


// ===============================
// إنشاء حساب
// ===============================

document.getElementById("register").onclick =
async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

if(!email || !password){

alert(
ar
?"أدخل البريد الإلكتروني وكلمة المرور أولاً"
:"Enter email and password first"
);

return;
}

if(password.length < 6){

alert(
ar
?"كلمة المرور يجب أن تكون 6 أحرف على الأقل"
:"Password must be at least 6 characters"
);

return;
}

const { data, error } =
await supabaseClient.auth.signUp({
email: email,
password: password
});

if(error){

alert(
ar
?"خطأ: "+error.message
:"Error: "+error.message
);

return;
}

alert(
ar
?"تم إنشاء الحساب. تحقق من بريدك الإلكتروني إذا طلب Supabase ذلك."
:"Account created. Check your email if Supabase asks you to."
);

};

</script>

</body>
</html>
