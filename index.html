<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M2 Work Platform</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
padding:20px;
font-family:Arial,sans-serif;
background:#111827;
color:white;
display:flex;
justify-content:center;
align-items:center;
}

.box{
width:100%;
max-width:420px;
background:#1f2937;
padding:28px 20px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 35px #0008;
}

.logo{
width:70px;
height:70px;
margin:auto;
border-radius:18px;
background:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
font-weight:bold;
}

h1{
margin:18px 0 8px;
}

p{
color:#cbd5e1;
}

input,
button{
width:100%;
padding:14px;
margin:7px 0;
border:0;
border-radius:10px;
font-size:16px;
}

input{
background:white;
color:#111827;
}

button{
background:#2563eb;
color:white;
font-weight:bold;
cursor:pointer;
}

.lang{
background:#374151;
}

.register{
color:#60a5fa;
margin:16px 0;
cursor:pointer;
}

.message{
margin-top:12px;
font-size:14px;
color:#fbbf24;
}
</style>

</head>

<body>

<div class="box">

<button class="lang" id="lang">
English
</button>

<div class="logo">
M
