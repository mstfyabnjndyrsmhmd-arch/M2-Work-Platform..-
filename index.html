<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M2 Work Platform</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
padding:20px;
font-family:Arial,sans-serif;
background:#111827;
color:white;
display:flex;
justify-content:center;
align-items:center;
}

.box{
width:100%;
max-width:420px;
background:#1f2937;
padding:28px 20px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 35px #0008;
}

.logo{
width:70px;
height:70px;
margin:auto;
border-radius:18px;
background:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
font-weight:bold;
}

h1{
margin:18px 0 8px;
}

p{
color:#cbd5e1;
}

input,
button{
width:100%;
padding:14px;
margin:7px 0;
border:0;
border-radius:10px;
font-size:16px;
}

input{
background:white;
color:#111827;
}

button{
background:#2563eb;
color:white;
font-weight:bold;
cursor:pointer;
}

.lang{
background:#374151;
}

.register{
color:#60a5fa;
margin:16px 0;
cursor:pointer;
}

.message{
margin-top:12px;
font-size:14px;
color:#fbbf24;
}
</style>
</head>

<body>

<div class="box">

<button class="lang" id="lang">
English
</button>

<div class="logo">
M2
</div>

<h1 id="title">
منصة M2 للعمل
</h1>

<p id="desc">
منصة للعمل وإدارة الحساب والطلبات
</p>

<input
id="email"
type="email"
placeholder="البريد الإلكتروني"
>

<input
id="password"
type="password"
placeholder="كلمة المرور"
>

<button id="login">
تسجيل الدخول
</button>

<div class="register" id="register">
ليس لديك حساب؟ إنشاء حساب
</div>

<div class="message" id="message"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://scjyudgdvlfzeewbnmyt.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_yEWBEwKdcm1FtKWziyPZ2A_uE4NvV3J";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

let ar = true;

const lang =
document.getElementById("lang");

const title =
document.getElementById("title");

const desc =
document.getElementById("desc");

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const login =
document.getElementById("login");

const register =
document.getElementById("register");

const message =
document.getElementById("message");

function showMessage(text){
message.textContent = text;
}

lang.onclick = function(){

ar = !ar;

document.documentElement.lang =
ar ? "ar" : "en";

document.documentElement.dir =
ar ? "rtl" : "ltr";

lang.textContent =
ar ? "English" : "العربية";

title.textContent =
ar ? "منصة M2 للعمل" : "M2 Work Platform";

desc.textContent =
ar ? "منصة للعمل وإدارة الحساب والطلبات"
: "Platform for work, account and requests";

email.placeholder =
ar ? "البريد الإلكتروني" : "Email";

password.placeholder =
ar ? "كلمة المرور" : "Password";

login.textContent =
ar ? "تسجيل الدخول" : "Login";

register.textContent =
ar ? "ليس لديك حساب؟ إنشاء حساب"
: "Don't have an account? Register";

showMessage("");
};

login.onclick = async function(){

showMessage("");

const userEmail = email.value.trim();
const userPassword = password.value;

if(!userEmail || !userPassword){
showMessage(
ar ? "يرجى إدخال البريد الإلكتروني وكلمة المرور"
: "Please enter email and password"
);
return;
}

const { error } =
await supabaseClient.auth.signInWithPassword({
email:userEmail,
password:userPassword
});

if(error){
showMessage(
(ar ? "خطأ: " : "Error: ") + error.message
);
return;
}

showMessage(
ar ? "تم تسجيل الدخول بنجاح"
: "Login successful"
);

};

register.onclick = async function(){

showMessage("");

const userEmail = email.value.trim();
const userPassword = password.value;

if(!userEmail || !userPassword){
showMessage(
ar ? "أدخل البريد الإلكتروني وكلمة المرور أولاً"
: "Enter email and password first"
);
return;
}

if(userPassword.length < 6){
showMessage(
ar ? "كلمة المرور يجب أن تكون 6 أحرف على الأقل"
: "Password must be at least 6 characters"
);
return;
}

const { error } =
await supabaseClient.auth.signUp({
email:userEmail,
password:userPassword
});

if(error){
showMessage(
(ar ? "خطأ: " : "Error: ") + error.message
);
return;
}

showMessage(
ar
? "تم إنشاء الحساب. تحقق من بريدك الإلكتروني إذا طلب Supabase ذلك."
: "Account created. Check your email if Supabase asks you to."
);

};

</script>

</body>
</html>
