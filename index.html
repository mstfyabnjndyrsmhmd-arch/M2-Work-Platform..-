<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2 Work Platform</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
min-height:100vh;
background:#111827;
color:#fff;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
padding:20px
}
.box{
width:100%;
max-width:500px;
text-align:center
}
h1{
color:#38bdf8;
margin-bottom:10px
}
p{
color:#cbd5e1
}
.card{
background:#1f2937;
padding:25px;
border-radius:15px;
margin-top:20px;
box-shadow:0 10px 30px #0005
}
input,button{
width:100%;
padding:14px;
margin:8px 0;
border:0;
border-radius:10px;
font-size:16px
}
input{
background:#374151;
color:white
}
button{
background:#0284c7;
color:white;
font-weight:bold;
cursor:pointer
}
button:hover{
background:#0369a1
}
#result{
display:none;
margin-top:15px;
color:#4ade80
}
</style>
</head>

<body>

<div class="box">

<h1>🚀 M2 Work Platform</h1>
<p>منصة العمل الخاصة بك</p>

<div class="card">

<h2>ابدأ الآن</h2>

<input id="name" type="text" placeholder="اكتب اسمك">

<input id="work" type="text" placeholder="ما هو عملك؟">

<button onclick="startWork()">ابدأ</button>

<div id="result"></div>

</div>

</div>

<script>
function startWork(){
let name=document.getElementById("name").value.trim();
let work=document.getElementById("work").value.trim();
let result=document.getElementById("result");

if(!name||!work){
result.style.display="block";
result.style.color="#f87171";
result.textContent="⚠️ اكتب الاسم والعمل أولاً";
return;
}

result.style.display="block";
result.style.color="#4ade80";
result.textContent="✅ أهلاً "+name+"! تم بدء العمل: "+work;
}
</script>

</body>
</html>
