<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M2 Work Platform</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#111827;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  width:100%;
  max-width:420px;
  background:#1f2937;
  padding:28px 20px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 10px 35px #0008;
}

.logo{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:18px;
  background:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:bold;
}

h1{
  margin:18px 0 8px;
}

p{
  color:#cbd5e1;
}

input,
button{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:0;
  border-radius:10px;
  font-size:16px;
}

input{
  background:white;
  color:#111827;
}

button{
  background:#2563eb;
  color:white;
  font-weight:bold;
}

.lang{
  background:#374151;
}

.registerBtn{
  background:#374151;
  color:#60a5fa;
}

.backBtn{
  background:#374151;
}

.message{
  margin-top:12px;
  font-size:14px;
  color:#fbbf24;
  line-height:1.6;
}

.hidden{
  display:none;
}

.task{
  background:#374151;
  padding:15px;
  margin-top:12px;
  border-radius:12px;
  text-align:right;
}

.task h3{
  margin-top:0;
}

.logout{
  background:#dc2626;
  margin-top:20px;
}
</style>
</head>

<body>

<!-- صفحة تسجيل الدخول -->

<div class="box" id="loginPage">

<button class="lang" id="lang">
English
</button>

<div class="logo">M2</div>

<h1 id="loginTitle">
منصة M2 للعمل
</h1>

<p id="loginDesc">
منصة للعمل وإدارة الحساب والطلبات
</p>

<input
id="loginEmail"
type="email"
placeholder="البريد الإلكتروني"
autocomplete="email"
>

<input
id="loginPassword"
type="password"
placeholder="كلمة المرور"
autocomplete="current-password"
>

<button id="loginBtn">
تسجيل الدخول
</button>

<button class="registerBtn" id="openRegister">
إنشاء حساب جديد
</button>

<div class="message" id="loginMessage"></div>

</div>


<!-- صفحة إنشاء الحساب -->

<div class="box hidden" id="registerPage">

<div class="logo">M2</div>

<h1 id="registerTitle">
إنشاء حساب جديد
</h1>

<p id="registerDesc">
أنشئ حسابك في منصة M2
</p>

<input
id="registerEmail"
type="email"
placeholder="البريد الإلكتروني"
autocomplete="email"
>

<input
id="registerPassword"
type="password"
placeholder="كلمة المرور"
autocomplete="new-password"
>

<input
id="registerPassword2"
type="password"
placeholder="تأكيد كلمة المرور"
autocomplete="new-password"
>

<button id="createAccountBtn">
إنشاء الحساب
</button>

<button class="backBtn" id="backLogin">
العودة لتسجيل الدخول
</button>

<div class="message" id="registerMessage"></div>

</div>


<!-- لوحة المستخدم -->

<div class="box hidden" id="dashboard">

<div class="logo">M2</div>

<h1>
لوحة المستخدم
</h1>

<p id="welcome"></p>

<h2>
📋 مهامي
</h2>

<div id="tasks">
جاري تحميل المهام...
</div>

<button class="logout" id="logout">
تسجيل الخروج
</button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://scjyudgdvlfzeewbnmyt.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_yEWBEwKdcm1FtKWziyPZ2A_uE4NvV3J";

const M2_SITE_URL =
"https://mstfyabnjndyrsmhmd-arch.github.io/M2-Work-Platform..-/";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


let ar = true;


/* الصفحات */

const loginPage =
document.getElementById("loginPage");

const registerPage =
document.getElementById("registerPage");

const dashboard =
document.getElementById("dashboard");


/* تسجيل الدخول */

const loginEmail =
document.getElementById("loginEmail");

const loginPassword =
document.getElementById("loginPassword");

const loginBtn =
document.getElementById("loginBtn");

const openRegister =
document.getElementById("openRegister");

const loginMessage =
document.getElementById("loginMessage");


/* التسجيل */

const registerEmail =
document.getElementById("registerEmail");

const registerPassword =
document.getElementById("registerPassword");

const registerPassword2 =
document.getElementById("registerPassword2");

const createAccountBtn =
document.getElementById("createAccountBtn");

const backLogin =
document.getElementById("backLogin");

const registerMessage =
document.getElementById("registerMessage");


/* لوحة المستخدم */

const welcome =
document.getElementById("welcome");

const tasks =
document.getElementById("tasks");

const logout =
document.getElementById("logout");


/* اللغة */

const lang =
document.getElementById("lang");

const loginTitle =
document.getElementById("loginTitle");

const loginDesc =
document.getElementById("loginDesc");

const registerTitle =
document.getElementById("registerTitle");

const registerDesc =
document.getElementById("registerDesc");


/* فتح التسجيل */

openRegister.onclick = function(){

loginPage.classList.add("hidden");

registerPage.classList.remove("hidden");

loginMessage.textContent = "";

};


/* العودة */

backLogin.onclick = function(){

registerPage.classList.add("hidden");

loginPage.classList.remove("hidden");

registerMessage.textContent = "";

};


/* تسجيل الدخول */

loginBtn.onclick = async function(){

loginMessage.textContent = "";

const email =
loginEmail.value.trim();

const password =
loginPassword.value;


if(!email || !password){

loginMessage.textContent =
ar
? "يرجى إدخال البريد الإلكتروني وكلمة المرور"
: "Please enter email and password";

return;
}


loginBtn.disabled = true;

loginBtn.textContent =
ar ? "جاري الدخول..." : "Logging in...";


const { error } =
await supabaseClient.auth.signInWithPassword({

email: email,

password: password

});


loginBtn.disabled = false;

loginBtn.textContent =
ar ? "تسجيل الدخول" : "Login";


if(error){

loginMessage.textContent =
(ar ? "خطأ: " : "Error: ")
+ error.message;

return;
}


await loadDashboard();

};


/* إنشاء الحساب */

createAccountBtn.onclick = async function(){

registerMessage.textContent = "";

const email =
registerEmail.value.trim();

const password =
registerPassword.value;

const password2 =
registerPassword2.value;


if(!email){

registerMessage.textContent =
ar
? "أدخل البريد الإلكتروني"
: "Enter your email";

return;
}


if(!password){

registerMessage.textContent =
ar
? "أدخل كلمة المرور"
: "Enter your password";

return;
}


if(password.length < 6){

registerMessage.textContent =
ar
? "كلمة المرور يجب أن تكون 6 أحرف على الأقل"
: "Password must be at least 6 characters";

return;
}


if(password !== password2){

registerMessage.textContent =
ar
? "كلمتا المرور غير متطابقتين"
: "Passwords do not match";

return;
}


createAccountBtn.disabled = true;

createAccountBtn.textContent =
ar
? "جاري إنشاء الحساب..."
: "Creating account...";


const { data, error } =
await supabaseClient.auth.signUp({

email: email,

password: password,

options: {
emailRedirectTo: M2_SITE_URL
}

});


createAccountBtn.disabled = false;

createAccountBtn.textContent =
ar
? "إنشاء الحساب"
: "Create Account";


if(error){

registerMessage.textContent =
(ar ? "خطأ: " : "Error: ")
+ error.message;

return;
}


/*
إذا كان تأكيد البريد مفعلاً،
سيطلب Supabase من المستخدم تأكيد بريده.
*/

if(data && data.session){

registerMessage.textContent =
ar
? "تم إنشاء الحساب بنجاح."
: "Account created successfully.";

await loadDashboard();

return;
}


registerMessage.textContent =
ar
? "تم إنشاء الحساب. افتح بريدك الإلكتروني واضغط رابط تأكيد الحساب، ثم ارجع وسجّل الدخول."
: "Account created. Open your email, confirm your account, then return and log in.";

};


/* تحميل لوحة المستخدم */

async function loadDashboard(){

loginPage.classList.add("hidden");

registerPage.classList.add("hidden");

dashboard.classList.remove("hidden");


const {
data: { user }
} =
await supabaseClient.auth.getUser();


if(!user){

dashboard.classList.add("hidden");

loginPage.classList.remove("hidden");

return;
}


welcome.textContent =
(ar ? "مرحبًا بك، " : "Welcome, ")
+ user.email;


tasks.innerHTML =
ar
? "جاري تحميل المهام..."
: "Loading tasks...";


const { data, error } =
await supabaseClient
.from("tasks")
.select("*")
.eq("assigned_to", user.id)
.order("created_at", {
ascending:false
});


if(error){

tasks.innerHTML =
(ar ? "حدث خطأ: " : "Error: ")
+ error.message;

return;
}


if(!data || data.length === 0){

tasks.innerHTML =
ar
? "لا توجد مهام مخصصة لك حاليًا."
: "No tasks assigned to you.";

return;
}


tasks.innerHTML = "";


data.forEach(function(task){

const div =
document.createElement("div");

div.className = "task";


const h3 =
document.createElement("h3");

h3.textContent =
task.title || "";


const description =
document.createElement("p");

description.textContent =
task.description || "";


const reward =
document.createElement("p");

reward.textContent =
ar
? "💰 المكافأة: " + task.reward
: "💰 Reward: " + task.reward;


const status =
document.createElement("p");

status.textContent =
ar
? "الحالة: " + task.status
: "Status: " + task.status;


div.appendChild(h3);

div.appendChild(description);

div.appendChild(reward);

div.appendChild(status);

tasks.appendChild(div);

});

}


/* تسجيل الخروج */

logout.onclick = async function(){

await supabaseClient.auth.signOut();

dashboard.classList.add("hidden");

loginPage.classList.remove("hidden");

loginEmail.value = "";

loginPassword.value = "";

};


/* زر اللغة */

lang.onclick = function(){

ar = !ar;


document.documentElement.lang =
ar ? "ar" : "en";

document.documentElement.dir =
ar ? "rtl" : "ltr";


lang.textContent =
ar ? "English" : "العربية";


loginTitle.textContent =
ar
? "منصة M2 للعمل"
: "M2 Work Platform";


loginDesc.textContent =
ar
? "منصة للعمل وإدارة الحساب والطلبات"
: "Platform for work, account and requests";


loginEmail.placeholder =
ar
? "البريد الإلكتروني"
: "Email";


loginPassword.placeholder =
ar
? "كلمة المرور"
: "Password";


loginBtn.textContent =
ar
? "تسجيل الدخول"
: "Login";


openRegister.textContent =
ar
? "إنشاء حساب جديد"
: "Create New Account";


registerTitle.textContent =
ar
? "إنشاء حساب جديد"
: "Create New Account";


registerDesc.textContent =
ar
? "أنشئ حسابك في منصة M2"
: "Create your M2 account";


registerEmail.placeholder =
ar
? "البريد الإلكتروني"
: "Email";


registerPassword.placeholder =
ar
? "كلمة المرور"
: "Password";


registerPassword2.placeholder =
ar
? "تأكيد كلمة المرور"
: "Confirm Password";


createAccountBtn.textContent =
ar
? "إنشاء الحساب"
: "Create Account";


backLogin.textContent =
ar
? "العودة لتسجيل الدخول"
: "Back to Login";


logout.textContent =
ar
? "تسجيل الخروج"
: "Logout";

};


/* مراقبة تسجيل الدخول */

supabaseClient.auth.onAuthStateChange(
async function(event, session){
if(session){

  await loadDashboard();

}

});


/* فحص الجلسة عند فتح الموقع */

(async function(){

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();


  if(session){

    await loadDashboard();

  }

})();

</script>

</body>
</html>
