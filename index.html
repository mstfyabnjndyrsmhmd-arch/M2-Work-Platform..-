<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M2 Work Platform</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#111827;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  width:100%;
  max-width:420px;
  background:#1f2937;
  padding:28px 20px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 10px 35px #0008;
}

.logo{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:18px;
  background:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:bold;
}

h1{
  margin:18px 0 8px;
}

p{
  color:#cbd5e1;
}

input,
button{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:0;
  border-radius:10px;
  font-size:16px;
}

input{
  background:white;
  color:#111827;
}

button{
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.lang{
  background:#374151;
}

.register{
  color:#60a5fa;
  margin:16px 0;
  cursor:pointer;
}

.message{
  margin-top:12px;
  font-size:14px;
  color:#fbbf24;
  line-height:1.6;
}

.hidden{
  display:none;
}

.task{
  background:#374151;
  padding:15px;
  margin-top:12px;
  border-radius:12px;
  text-align:right;
}

.task h3{
  margin-top:0;
}

.logout{
  background:#dc2626;
  margin-top:20px;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div class="box" id="loginPage">

<button class="lang" id="lang">English</button>

<div class="logo">M2</div>

<h1 id="title">منصة M2 للعمل</h1>

<p id="desc">
منصة للعمل وإدارة الحساب والطلبات
</p>

<input
id="email"
type="email"
placeholder="البريد الإلكتروني"
autocomplete="email"
>

<input
id="password"
type="password"
placeholder="كلمة المرور"
autocomplete="current-password"
>

<button id="login">
تسجيل الدخول
</button>

<div class="register" id="register">
ليس لديك حساب؟ إنشاء حساب
</div>

<div class="message" id="message"></div>

</div>


<!-- DASHBOARD -->

<div class="box hidden" id="dashboard">

<div class="logo">M2</div>

<h1 id="dashboardTitle">
لوحة المستخدم
</h1>

<p id="welcome"></p>

<h2 id="tasksTitle">
📋 مهامي
</h2>

<div id="tasks">
جاري تحميل المهام...
</div>

<button class="logout" id="logout">
تسجيل الخروج
</button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://scjyudgdvlfzeewbnmyt.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_yEWBEwKdcm1FtKWziyPZ2A_uE4NvV3J";

const M2_SITE_URL =
"https://mstfyabnjndyrsmhmd-arch.github.io/M2-Work-Platform..-/";


const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


let ar = true;


const loginPage =
document.getElementById("loginPage");

const dashboard =
document.getElementById("dashboard");

const lang =
document.getElementById("lang");

const title =
document.getElementById("title");

const desc =
document.getElementById("desc");

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const login =
document.getElementById("login");

const register =
document.getElementById("register");

const message =
document.getElementById("message");

const welcome =
document.getElementById("welcome");

const tasks =
document.getElementById("tasks");

const logout =
document.getElementById("logout");

const dashboardTitle =
document.getElementById("dashboardTitle");

const tasksTitle =
document.getElementById("tasksTitle");


function showMessage(text){
  message.textContent = text;
}


async function loadDashboard(){

  loginPage.classList.add("hidden");
  dashboard.classList.remove("hidden");

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if(!user){
    return;
  }

  welcome.textContent =
    (ar ? "مرحبًا بك، " : "Welcome, ") + user.email;

  tasks.innerHTML =
    ar ? "جاري تحميل المهام..." : "Loading tasks...";


  const { data, error } =
    await supabaseClient
      .from("tasks")
      .select("*")
      .eq("assigned_to", user.id)
      .order("created_at", {
        ascending:false
      });


  if(error){

    tasks.innerHTML =
      (ar ? "حدث خطأ: " : "Error: ")
      + error.message;

    return;
  }


  if(!data || data.length === 0){

    tasks.innerHTML =
      ar
      ? "لا توجد مهام مخصصة لك حاليًا."
      : "No tasks assigned to you.";

    return;
  }


  tasks.innerHTML = "";


  data.forEach(task => {

    const div =
      document.createElement("div");

    div.className = "task";


    const h3 =
      document.createElement("h3");

    h3.textContent =
      task.title || "";


    const description =
      document.createElement("p");

    description.textContent =
      task.description || "";


    const reward =
      document.createElement("p");

    reward.textContent =
      ar
      ? "💰 المكافأة: " + task.reward
      : "💰 Reward: " + task.reward;


    const status =
      document.createElement("p");

    status.textContent =
      ar
      ? "الحالة: " + task.status
      : "Status: " + task.status;


    div.appendChild(h3);
    div.appendChild(description);
    div.appendChild(reward);
    div.appendChild(status);

    tasks.appendChild(div);

  });

}


login.onclick = async function(){

  showMessage("");

  const userEmail =
    email.value.trim();

  const userPassword =
    password.value;


  if(!userEmail || !userPassword){

    showMessage(
      ar
      ? "يرجى إدخال البريد الإلكتروني وكلمة المرور"
      : "Please enter email and password"
    );

    return;
  }


  const { error } =
    await supabaseClient.auth.signInWithPassword({

      email:userEmail,

      password:userPassword

    });


  if(error){

    showMessage(
      (ar ? "خطأ: " : "Error: ")
      + error.message
    );

    return;
  }


  await loadDashboard();

};


register.onclick = async function(){

  showMessage("");

  const userEmail =
    email.value.trim();

  const userPassword =
    password.value;


  if(!userEmail || !userPassword){

    showMessage(
      ar
      ? "أدخل البريد الإلكتروني وكلمة المرور أولاً"
      : "Enter email and password first"
    );

    return;
  }


  if(userPassword.length < 6){

    showMessage(
      ar
      ? "كلمة المرور يجب أن تكون 6 أحرف على الأقل"
      : "Password must be at least 6 characters"
    );

    return;
  }


  showMessage(
    ar
    ? "جاري إنشاء الحساب..."
    : "Creating account..."
  );


  const { data, error } =
    await supabaseClient.auth.signUp({

      email:userEmail,

      password:userPassword,

      options:{
        emailRedirectTo:M2_SITE_URL
      }

    });


  if(error){

    showMessage(
      (ar ? "خطأ: " : "Error: ")
      + error.message
    );

    return;
  }


  if(data && data.session){

    showMessage(
      ar
      ? "تم إنشاء الحساب وتسجيل الدخول."
      : "Account created and signed in."
    );

    await loadDashboard();

    return;
  }


  showMessage(
    ar
    ? "تم إنشاء الحساب. افتح بريدك الإلكتروني واضغط رابط تأكيد الحساب، ثم ارجع إلى موقع M2 وسجّل الدخول."
    : "Account created. Open your email, confirm your account, then return to M2 and log in."
  );

};


lang.onclick = function(){

  ar = !ar;


  document.documentElement.lang =
    ar ? "ar" : "en";


  document.documentElement.dir =
    ar ? "rtl" : "ltr";


  lang.textContent =
    ar ? "English" : "العربية";


  title.textContent =
    ar
    ? "منصة M2 للعمل"
    : "M2 Work Platform";


  desc.textContent =
    ar
    ? "منصة للعمل وإدارة الحساب والطلبات"
    : "Platform for work, account and requests";


  email.placeholder =
    ar
    ? "البريد الإلكتروني"
    : "Email";


  password.placeholder =
    ar
    ? "كلمة المرور"
    : "Password";


  login.textContent =
    ar
    ? "تسجيل الدخول"
    : "Login";


  register.textContent =
    ar
    ? "ليس لديك حساب؟ إنشاء حساب"
    : "Don't have an account? Register";


  dashboardTitle.textContent =
    ar
    ? "لوحة المستخدم"
    : "User Dashboard";


  tasksTitle.textContent =
    ar
    ? "📋 مهامي"
    : "📋 My Tasks";


  logout.textContent =
    ar
    ? "تسجيل الخروج"
    : "Logout";

};


logout.onclick = async function(){

  await supabaseClient.auth.signOut();

  dashboard.classList.add("hidden");

  loginPage.classList.remove("hidden");

  email.value = "";

  password.value = "";

  showMessage("");

};


supabaseClient.auth.onAuthStateChange(
  async function(event, session){

    if(session){

      await loadDashboard();

    }

  }
);


(async function(){

  const {
    data: { session }
  } =
    await supabaseClient.auth.getSession();


  if(session){

    await loadDashboard();

  }

})();

</script>

</body>
</html>
